
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>VitaCoreX LLC — ROI Calculator</title><link rel="stylesheet" href="app.css"></head><body><div class="wrap"><div class="top"><div class="logo">VitaCoreX LLC</div><a class="back" href="resources.html">← Back to resources</a></div><section class="hero"><h1>ROI Calculator</h1><p class="muted">Simple executive calculator for illustrative recovery uplift.</p></section><div class="grid"><div class="card"><input id="balances" placeholder="Monthly balances, e.g. 420000"><input id="improvement" placeholder="Improvement %, e.g. 21"><button class="btn" onclick="calc()">Calculate</button><h2 id="result"></h2></div><div class="card"><h3>Reference case</h3><table><tr><th>Metric</th><th>Value</th></tr><tr><td>Monthly patient balances</td><td>$420,000</td></tr><tr><td>Recovery improvement</td><td>21%</td></tr><tr><td>Additional monthly revenue</td><td>$88,200</td></tr></table></div></div></div><script>function calc(){const b=parseFloat(document.getElementById('balances').value||0),i=parseFloat(document.getElementById('improvement').value||0);const r=b*(i/100);document.getElementById('result').textContent='Potential additional monthly revenue: $'+r.toLocaleString(undefined,{maximumFractionDigits:2});}</script></body></html>
