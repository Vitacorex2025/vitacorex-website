name: IndexNow — Instant Search Engine Notification
on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/**'
      - '**.md'
  workflow_dispatch:

jobs:
  indexnow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Notify Search Engines via IndexNow (every page in sitemap.xml)
        run: node scripts/indexnow-submit.mjs

      - name: Ping Google PubSubHubbub
        run: |
          curl -s "https://pubsubhubbub.appspot.com/publish" \
            -d "hub.mode=publish&hub.url=https://vitacorexllc.com/feed.xml"
