# P17 Step 17.6 — CTA regression guard.
#
# Runs the Step 17.1 inventory audit + Step 17.2 target verifier on every push
# to `main` and every PR. Any broken CTA (exit code 2) fails the build.
#
# Sequence MUST be audit → verify (not verify alone). Lesson from Step 17.4
# post-fix incident: verifier reads docs/qa/cta-inventory.md, which is
# generated by audit-ctas.js. Running verify against a stale inventory
# reports stale broken rows. CI ALWAYS regenerates inventory first.
#
# Concurrency throttle on external HEAD checks is handled inside
# scripts/verify-cta-targets.js (CONCURRENCY=4, TIMEOUT_MS=10000, 5-hop
# redirect follow, HEAD→GET retry on 405). No additional workflow-level
# throttling required.
#
# Exit codes (both scripts):
#   0 — clean
#   1 — fatal (unexpected error; stack trace in logs)
#   2 — validation failure (unclassified rows for audit; broken rows for verify)

name: QA — CTA audit + target verifier

on:
  push:
    branches: [main]
    paths:
      - '**.html'
      - 'scripts/audit-ctas.js'
      - 'scripts/verify-cta-targets.js'
      - '.github/workflows/qa-cta.yml'
  pull_request:
    paths:
      - '**.html'
      - 'scripts/audit-ctas.js'
      - 'scripts/verify-cta-targets.js'
      - '.github/workflows/qa-cta.yml'
  workflow_dispatch:

jobs:
  cta:
    name: Inventory + verify CTA targets
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Audit — regenerate CTA inventory (audit-ctas.js)
        # Exit codes: 0 clean, 1 fatal, 2 unclassified rows (classifier gap).
        # Any non-zero is a real failure — audit must be clean before verify runs.
        run: node scripts/audit-ctas.js

      - name: Verify — HEAD-check + anchor-resolve every CTA target (verify-cta-targets.js)
        # Exit codes: 0 clean, 1 fatal, 2 broken rows present.
        # Exit 2 is EXPECTED on the baseline state (12 invalid-by-design rows —
        # 10 Group D no-handler + 2 Group C LinkedIn HTTP 999 bot-block — all
        # triage-documented in docs/qa/cta-triage.md). We allow exit 2 here and
        # enforce the gate via the subsequent git-diff step instead.
        # Exit 1 (crash) is still a real failure.
        run: |
          node scripts/verify-cta-targets.js || { code=$?; if [ "$code" -eq 2 ]; then echo "verify exited 2 (broken rows present) — expected; gate is enforced by baseline diff"; else echo "verify exited $code (fatal)"; exit "$code"; fi; }

      - name: Gate — diff regenerated baseline against committed baseline
        # Any drift in cta-inventory.md or cta-broken.md (beyond the
        # `generated:` timestamp) = new broken row introduced OR
        # existing row fix/removal that wasn't accompanied by a baseline
        # re-commit. Either way = CI fails; maintainer must triage and
        # commit the new baseline.
        #
        # -I "^generated:" ignores the single nondeterministic frontmatter line.
        run: |
          git diff --exit-code -I "^generated:" -- docs/qa/cta-inventory.md docs/qa/cta-broken.md

      - name: Upload regenerated baselines (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cta-baselines-${{ github.run_id }}
          path: |
            docs/qa/cta-inventory.md
            docs/qa/cta-broken.md
          if-no-files-found: warn
          retention-days: 30
