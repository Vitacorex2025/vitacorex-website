services:
  - type: web
    name: vitacorex-website
    runtime: python
    rootDir: vcx-api
    # Paid plan: never sleeps, and a persistent disk keeps orders, payments and uploads across restarts.
    plan: starter
    buildCommand: pip install -r requirements.txt
    # One process: the notification outbox worker runs inside it.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port 10000
    healthCheckPath: /healthz
    disk:
      name: vcx-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.14.3"
      - key: VCX_ENV
        value: production
      - key: VCX_PAYMENTS_MODE
        value: stripe_live
      - key: VCX_SITE_BASE
        value: https://vitacorexllc.com
      - key: VCX_BASE_URL
        value: https://vitacorexllc.com
      - key: VCX_ALLOWED_ORIGINS
        value: "https://vitacorexllc.com,https://www.vitacorexllc.com"
      - key: VCX_CORS_ALLOW_CREDENTIALS
        value: "true"
      - key: VCX_DB_PATH
        value: /var/data/vcx.db
      - key: VCX_UPLOADS_DIR
        value: /var/data/uploads
      - key: VCX_MAX_UPLOAD_MB
        value: "25"
      - key: VCX_OWNER_EMAIL
        value: stevenmiller@vitacorexllc.com
      - key: VCX_SMTP_HOST
        value: smtp.gmail.com
      - key: VCX_SMTP_PORT
        value: "587"
      # Generated by Render on first creation; never in the repository.
      - key: VCX_ADMIN_TOKEN
        generateValue: true
      - key: VCX_VOICE_TOOL_SECRET
        generateValue: true
      # Entered by the owner in the Render dashboard only (sync: false = no value in this file).
      - key: VCX_API_BASE
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: VCX_STRIPE_WEBHOOK_SECRET
        sync: false
      - key: VCX_SMTP_USER
        sync: false
      - key: VCX_SMTP_PASS
        sync: false
      - key: VCX_FROM_EMAIL
        sync: false
