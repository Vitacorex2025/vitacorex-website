services:
  - type: web
    name: docketmint
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    disk:
      name: docketmint-storage
      mountPath: /var/data
      sizeGB: 5
    envVars:
      - key: DOCKETMINT_ENV
        value: production
      - key: DOCKETMINT_API_PREFIX
        value: /api
      - key: DOCKETMINT_STORAGE_PATH
        value: /var/data/docketmint-storage
      - key: DOCKETMINT_PUBLIC_APP_URL
        value: https://docketmint.app
      - key: DOCKETMINT_PUBLIC_APP_WWW_URL
        value: https://www.docketmint.app
      - key: DOCKETMINT_RENDER_SERVICE_URL
        value: https://docketmint.onrender.com
      - key: DOCKETMINT_PUBLIC_API_URL
        value: https://docketmint.onrender.com/api
      - key: DOCKETMINT_ALLOWED_ORIGINS
        value: https://docketmint.app,https://www.docketmint.app,https://docketmint.onrender.com,https://docketmint.vercel.app
