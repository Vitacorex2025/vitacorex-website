services:
  - type: web
    name: vitacorex-website
    runtime: python
    rootDir: vcx-api
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port 10000
    healthCheckPath: /healthz
    envVars:
      - key: VCX_ALLOWED_ORIGINS
        value: "https://vitacorexllc.com,https://vitacorex2025.github.io"
      - key: VCX_CORS_ALLOW_CREDENTIALS
        value: "true"
      - key: PYTHON_VERSION
        value: "3.11.9"
